server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript application/manifest+json image/svg+xml;

  # nginx's built-in type list has no .webmanifest entry.
  location ~ \.webmanifest$ { default_type application/manifest+json; }

  # The service worker must always be fresh so app updates reach users.
  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
